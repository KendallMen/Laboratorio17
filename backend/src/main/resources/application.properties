# ==============================================================================
# InsecurePay Backend - Configuracion de la Billetera Digital
# NOTA PEDAGOGICA: Contiene configuraciones intencionalmente vulnerables
# ==============================================================================

server.port=8080

# Configuracion de Base de Datos H2 en Memoria
spring.datasource.url=jdbc:h2:mem:insecure_pay_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# La consola H2 no se expone desde la aplicacion.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Hibernate & JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Respuestas de error sin detalles internos ni trazas.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# JWT_SECRET debe ser una clave aleatoria de al menos 32 bytes, provista por el entorno.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

